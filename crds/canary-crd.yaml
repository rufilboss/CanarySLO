apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: canarydeployments.devsecops.io
spec:
  group: devsecops.io
  names:
    kind: CanaryDeployment
    listKind: CanaryDeploymentList
    plural: canarydeployments
    singular: canarydeployment
    shortNames:
      - cd
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetDeployment, canaryImage, prometheusUrl, thresholds]
              properties:
                targetDeployment:
                  type: string
                canaryImage:
                  type: string
                  minLength: 1
                canaryReplicas:
                  type: integer
                  default: 1
                  minimum: 1
                prometheusUrl:
                  type: string
                  minLength: 1
                stepWeight:
                  type: integer
                  default: 20
                  minimum: 1
                  maximum: 100
                rolloutSteps:
                  type: array
                  minItems: 1
                  description: Strictly increasing traffic percentages ending at 100.
                  items:
                    type: integer
                    minimum: 1
                    maximum: 100
                intervalSeconds:
                  type: integer
                  default: 30
                  minimum: 1
                thresholds:
                  type: object
                  properties:
                    maxErrorRatePercent:
                      type: number
                      minimum: 0
                    maxP99LatencySeconds:
                      type: number
                      minimum: 0
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}