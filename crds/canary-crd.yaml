apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: canarydeployments.devsecops.io
spec:
  group: devsecops.io
  names:
    kind: CanaryDeployment
    listKind: CanaryDeploymentList
    plural: canarydeployments
    singular: canarydeployment
    shortNames:
      - cd
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetDeployment, canaryImage, prometheusUrl, thresholds]
              properties:
                targetDeployment:
                  type: string
                  description: Name of the stable Deployment to canary.
                serviceName:
                  type: string
                  description: Name of the Kubernetes Service to route traffic through. Defaults to targetDeployment.
                canaryImage:
                  type: string
                  minLength: 1
                canaryReplicas:
                  type: integer
                  default: 1
                  minimum: 1
                prometheusUrl:
                  type: string
                  minLength: 1
                stepWeight:
                  type: integer
                  default: 20
                  minimum: 1
                  maximum: 100
                rolloutSteps:
                  type: array
                  minItems: 1
                  description: Strictly increasing traffic percentages ending at 100.
                  items:
                    type: integer
                    minimum: 1
                    maximum: 100
                intervalSeconds:
                  type: integer
                  default: 30
                  minimum: 1
                thresholds:
                  type: object
                  properties:
                    maxErrorRatePercent:
                      type: number
                      minimum: 0
                    maxP99LatencySeconds:
                      type: number
                      minimum: 0
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Initializing, Progressing, Promoted, Failed, Blocked]
                  description: Current rollout phase.
                trafficWeight:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Current traffic percentage sent to canary.
                currentStepIndex:
                  type: integer
                  minimum: -1
                  description: Index in rolloutSteps; -1 means not yet started.
                lastTransitionTime:
                  type: string
                  format: date-time
                  description: When the last step transition occurred (ISO 8601).
                lastAnalysisTime:
                  type: string
                  format: date-time
                  description: When the last Prometheus analysis ran (ISO 8601).
                reason:
                  type: string
                  description: Human-readable reason for current phase.
                canaryDeployment:
                  type: string
                  description: Name of the canary Deployment.
                stableService:
                  type: string
                  description: Name of the stable Service.
                canaryService:
                  type: string
                  description: Name of the canary Service.
                observedStableDeployment:
                  type: string
                  description: Name of the observed stable Deployment.
                observedCanaryImage:
                  type: string
                  description: Image used for the canary Deployment.
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}